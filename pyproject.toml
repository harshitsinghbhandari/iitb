[project]
name = "iitb"
version = "0.1.0"
description = "A command-line surface for IIT Bombay portals, built agent-first"
readme = "README.md"
requires-python = ">=3.10"
# The shell is argparse plus one import. A third-party dependency here would
# describe what the core does even if no string did, so there are none.
dependencies = ["iitb-core"]

[project.scripts]
iitb = "iitb.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["iitb*"]
